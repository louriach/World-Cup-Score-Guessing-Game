name: golden_goals
description: Golden Goals – Football Score Guessing Game
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.5.0

  # Navigation
  go_router: ^14.0.0

  # State management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Images
  cached_network_image: ^3.3.1
  image_picker: ^1.1.0

  # Push notifications (handles APNs on iOS, FCM on Android)
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.0

  # Auth
  sign_in_with_apple: ^6.1.0

  # Utilities
  intl: ^0.19.0
  share_plus: ^9.0.0
  url_launcher: ^6.3.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.0
  riverpod_lint: ^2.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
